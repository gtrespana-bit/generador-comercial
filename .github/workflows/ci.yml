name: CI

# Ejecuta las verificaciones que hasta ahora se hacían a mano (E1-038).
# Los dos últimos fallos de staging se detectaron en producción; esta puerta
# los habría visto antes de fusionar.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Barrido semanal completo: la red que garantiza que, aunque en cada PR solo
  # se escaneen los archivos del cambio, el repositorio entero pasa por
  # detect-secrets y por la suite al menos una vez por semana.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Si se empuja varias veces seguidas a la misma rama, cancela la ejecución
# anterior en lugar de acumular trabajo redundante.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # Ninguna etapa debe tocar una base real: se fuerza SQLite temporal.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pruebas:
    name: Pruebas y verificaciones
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          # Se necesita el histórico para comparar la rama con su base y
          # revisar solo las líneas que introduce el cambio.
          fetch-depth: 0

      - name: Preparar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Instalar dependencias fijadas
        # Se usa el cierre completo para que CI pruebe exactamente el mismo
        # conjunto de paquetes en cada ejecución (E1-037).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Comprobar que el lock corresponde a los requirements
        # Evita que alguien cambie requirements.txt y olvide regenerar el lock,
        # lo que dejaría a Vercel y CI instalando versiones distintas.
        run: python tools/verificar_lock.py

      - name: Escanear dependencias vulnerables (E4-030)
        # pip-audit consulta las bases de datos de vulnerabilidades (PyPA/OSV)
        # sobre el cierre completo fijado y falla si encuentra alguna.
        run: pip-audit -r requirements.lock

      - name: Escanear secretos en el repositorio (E4-030)
        # Recorrer los ~9.000 archivos versionados costaba 227 s, el 32 % del
        # job. Ahora, cuando el disparador es un pull_request, se escanean solo
        # los archivos que toca el cambio (completos, no solo las líneas del
        # diff): el resto ya pasó por este paso antes de entrar en `main` y su
        # estado aceptado vive en `.secrets.baseline` (hallazgos guardados como
        # hash, nunca en claro). El barrido completo sigue ocurriendo en cada
        # push a `main`, en workflow_dispatch y en el cron semanal.
        #
        # El criterio de fallo no cambia: cualquier hallazgo cuyo hash no esté
        # en el baseline rompe CI. El baseline admite los fixtures deliberados
        # (URLs de ejemplo, claves falsas de tests, hashes de migraciones). Se
        # escanea sobre una COPIA del baseline porque `--baseline` reescribe el
        # archivo que recibe y aquí solo interesa el conjunto resultante; por eso
        # además se excluye `.secrets.baseline` del recorrido (con la copia deja
        # de ser "el baseline" y se escanearía a sí mismo, con hallazgos nuevos
        # que son solo sus propios hashes).
        run: |
          set -euo pipefail
          cp .secrets.baseline /tmp/secretos-baseline-original.json
          cp .secrets.baseline /tmp/secretos-escaneo.json
          base="${{ github.event.pull_request.base.sha }}"
          archivos=()
          if [ -n "$base" ]; then
            mapfile -t archivos < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- .)
            echo "Pull request: ${#archivos[@]} archivo(s) cambiados frente a $base."
          fi
          if [ "${#archivos[@]}" -gt 0 ]; then
            detect-secrets scan --baseline /tmp/secretos-escaneo.json \
              --exclude-files '\.secrets\.baseline$' "${archivos[@]}" >/dev/null
          else
            echo "Barrido completo del repositorio."
            detect-secrets scan --baseline /tmp/secretos-escaneo.json \
              --exclude-files '\.secrets\.baseline$' >/dev/null
          fi
          python3 - <<'PY'
          import json
          import sys

          def claves(ruta):
              with open(ruta, encoding="utf-8") as fh:
                  datos = json.load(fh)
              return {
                  (archivo, h["hashed_secret"], h["type"])
                  for archivo, hallazgos in datos["results"].items()
                  for h in hallazgos
              }

          original = claves("/tmp/secretos-baseline-original.json")
          actual = claves("/tmp/secretos-escaneo.json")
          nuevas = actual - original
          if nuevas:
              print("::error::Secretos nuevos detectados (E4-030)")
              for archivo, hash_, tipo in sorted(nuevas):
                  print(f"  {archivo}  [{tipo}]")
              sys.exit(1)
          print("Sin secretos nuevos: baseline estable.")
          PY

      - name: Compilar todo el código Python
        run: python -m compileall -q app tools run.py desktop.py

      - name: Parsear las plantillas Jinja con el entorno real
        run: python tools/verificar_plantillas.py

      - name: Verificar la sintaxis del JavaScript
        run: |
          estado=0
          while IFS= read -r archivo; do
            if ! node --check "$archivo"; then
              echo "::error file=$archivo::Error de sintaxis JavaScript"
              estado=1
            fi
          done < <(find app/static/js -name '*.js')
          exit $estado

      - name: Detectar conflictos y espacios en blanco sobrantes
        # Solo se revisan las líneas que introduce este cambio. Revisar el
        # árbol completo marcaría los dos espacios finales de Markdown (que son
        # saltos de línea intencionales) y código antiguo ajeno al PR.
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "Sin confirmación base con la que comparar; se omite la revisión."
            exit 0
          fi
          echo "Comparando con $base"
          git diff --check "$base" -- . ':(exclude)*.md'

      - name: Simular el sistema de archivos de solo lectura de Vercel
        # Reproduce la restricción real de Vercel (solo /tmp escribible) en los
        # dos modos soportados, que ya provocó incidencias de arranque.
        run: |
          python tools/simular_vercel_rofs.py postgres
          python tools/simular_vercel_rofs.py sqlite

      - name: Ejecutar la suite automatizada
        # `-n auto` reparte la suite entre los núcleos del runner (pytest-xdist,
        # fijado en requirements.lock): ~3.370 pruebas bajan de ~7-9 min a ~2.
        # Si algún día aparece un fallo de aislamiento, `-n 2` es el primer
        # diagnóstico.
        run: pytest -q -n auto

  pruebas-postgresql:
    name: Pruebas PostgreSQL (RLS real)
    # Fase 0.1 de la hoja de ruta 2026-10-20. La suite general corre en
    # SQLite, donde no hay RLS ni booleanos estrictos: tres incidentes de
    # producción del 20/10/2026 fueron invisibles para ella. Este job
    # reconstruye el esquema con la cadena de migraciones desde una base
    # vacía y ejercita los servicios como el rol real (cotizat_runtime).
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Instalar dependencias fijadas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Ejecutar la batería PostgreSQL/RLS
        # Incluye test_rls_postgres.py, la batería del bootstrap que llevaba
        # escrita y saltándose desde siempre por falta de este servicio.
        env:
          COTIZAT_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/postgres
        run: pytest -q tests/test_postgresql_rls.py tests/test_rls_postgres.py
