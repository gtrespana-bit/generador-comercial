  CÓMO USARLA
  · Gmail: abre este archivo en el navegador (doble clic), selecciona la firma

    formato, inserta el archivo como HTML (Archivo → Opciones → Correo →
    Firmas → nueva firma).
  · Apple Mail: Arrastra la firma renderizada a la ventana de firmas, o pega el
    contenido de este archivo en el editor de firmas.

  POR QUÉ ESTÁ HECHA ASÍ
  · Estructura de tablas con CSS en línea: es lo único que Outlook (motor de

    texto y el hueco del logo.
  · Sin tipografías externas ni JavaScript: tipografía del sistema con
