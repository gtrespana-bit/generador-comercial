{# Shared public header: landing, how it works, plans and legal pages. #}
<nav class="nav" aria-label="Main">
  <a class="brand" href="/en-us/">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 3.5h6.5L18 8v11a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5a1.5 1.5 0 0 1 1-1.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M13.5 3.5V8H18" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M9 14.5l2 2 4-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    {{ product_name }}
  </a>
  <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
  <label for="nav-toggle" class="nav-burger" aria-label="Open or close menu">
    <span></span><span></span><span></span>
  </label>
  <div class="nav-links">
    <a class="nav-item{% if request.url.path == '/como-funciona' %} is-active{% endif %}" href="{{ '/en/como-funciona' }}">How it works</a>
    <a class="nav-item{% if request.url.path == '/legal/preguntas' %} is-active{% endif %}" href="{{ '/en/legal/preguntas' }}">FAQ</a>
    <a class="nav-item{% if request.url.path == '/pago' %} is-active{% endif %}" href="{{ '/en/pago' }}">Plans</a>
    {% if nav_modo == 'cuenta' %}
    <a class="entrar" href="/inicio">My dashboard</a>
    {% else %}
    <a class="entrar" href="/acceso">Sign in</a>
    {% if hay_prueba_gratuita() %}
    <a class="btn btn-primary" href="/acceso">Try {{ dias_de_prueba() }} days free</a>
    {% else %}
    <a class="btn btn-primary" href="{{ '/en/pago' }}">See plans</a>
    {% endif %}
    {% endif %}
  </div>
</nav>
