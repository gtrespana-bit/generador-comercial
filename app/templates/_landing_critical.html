{# CSS mínimo para el primer viewport de la landing.

e-height:1.25}.hero-points{list-style:none;margin:1.5rem 0 0;padding:0;display:grid;gap:.55rem}.hero-points li{display:flex;align-items:center;gap:.55rem;color:var(--text-secondary);font-size:.94rem;font-weight:500}.check{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--green-soft);color:var(--green);font-size:.7rem;font-weight:800;flex:0 0 auto}.hero-visual{position:relative;min-height:420px}.hero-stats{max-width:1160px;margin:3rem auto 0;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);background:var(--surface)}
