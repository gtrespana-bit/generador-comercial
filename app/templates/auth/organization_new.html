<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nueva organización · {{ product_name }}</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#17211d;background:#f3f7f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,520px);background:white;padding:34px;border-radius:18px;box-shadow:0 18px 55px rgba(10,48,34,.12)}.brand{font-weight:900;color:#0b5b38}h1{margin:24px 0 8px}.muted{color:#66776f;line-height:1.5}label{display:block;font-weight:800;margin:24px 0 8px}input{width:100%;border:1px solid #b9c8c1;border-radius:10px;padding:13px;font:inherit}input:focus{outline:3px solid #c7f1df;border-color:#16865a}button,.button{display:inline-block;border:0;border-radius:10px;padding:13px 17px;background:#146c43;color:white;font:inherit;font-weight:800;text-decoration:none;cursor:pointer;margin-top:20px}.secondary{background:#e7f4ee;color:#0b5b38;margin-left:8px}.alert{background:#fff0f0;color:#9b2529;border-radius:10px;padding:12px 14px;margin-top:18px}
  </style>
</head>
<body><main>
<div class="brand">{{ product_name }}</div>
<h1>Crea el espacio de tu empresa</h1>
<p class="muted">La cuenta {{ usuario.email }} quedará como propietaria. Después podrás completar los datos comerciales y elegir entre una demostración o un espacio limpio.</p>
{% if error %}<div class="alert">{{ error }}</div>{% endif %}
<form action="/organizaciones/nueva" method="post">
  <label for="nombre">Nombre comercial o razón social</label>
  <input id="nombre" name="nombre" maxlength="200" autocomplete="organization" required autofocus>
  <button type="submit">Crear organización</button>
  <a class="button secondary" href="/organizaciones">Volver</a>
</form>
</main></body></html>
