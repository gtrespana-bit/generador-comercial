<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar acceso · {{ product_name }}</title>
  <link rel="icon" type="image/png" href="/static/icono.png">
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color:#17211d; background:#f3f7f5; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; }
    main { width:min(100%,460px); background:#fff; padding:36px; border-radius:20px; box-shadow:0 22px 65px rgba(10,48,34,.14); }
    h1 { margin:0 0 10px; } p { color:#65766e; line-height:1.55; }
    label { display:block; margin:20px 0 7px; font-weight:700; }
    input { width:100%; padding:12px 13px; border:1px solid #b9c8c1; border-radius:10px; font:inherit; }
    button { width:100%; margin-top:18px; border:0; border-radius:10px; padding:13px; background:#146c43; color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    a { color:#146c43; font-weight:700; } .alert { padding:12px 14px; border-radius:10px; margin:15px 0; }
    .error { background:#fff0f0; color:#9b2529; } .success { background:#eaf8f1; color:#11623f; }
  </style>
</head>
<body><main>
  <h1>Recuperar acceso</h1>
  <p>Escribe el email de tu cuenta. Si existe, Supabase enviará un enlace temporal.</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  {% if msg %}<div class="alert success">{{ msg }}</div>{% endif %}
  <form method="post" action="/recuperar-acceso">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus>
    <button type="submit">Enviar enlace de recuperación</button>
  </form>
  <p><a href="/acceso">Volver al acceso</a></p>
</main></body>
</html>
