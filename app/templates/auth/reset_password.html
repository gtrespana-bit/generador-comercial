<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña · {{ product_name }}</title>
  <link rel="icon" type="image/png" href="/static/icono.png">
      <link rel="stylesheet" href="{{ 'css/fonts.css' | asset }}">
  <link rel="stylesheet" href="{{ 'css/public.css' | asset }}">
</head>
<body>
<div class="auth-stage">
  <main class="auth-card">
    <a class="brand" href="/acceso">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 3.5h6.5L18 8v11a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5a1.5 1.5 0 0 1 1-1.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M13.5 3.5V8H18" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9 14.5l2 2 4-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      {{ product_name }}
    </a>

    <h1>Elige una nueva contraseña</h1>
    <p>El enlace es temporal y se elimina de la barra del navegador al abrir esta página.</p>

    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <div id="token-error" class="alert error" hidden>El enlace no contiene una sesión de recuperación válida. Solicita uno nuevo.</div>

    <form id="reset-form" method="post" action="/restablecer-clave">
      <input id="recovery-token" type="hidden" name="recovery_token" value="{{ recovery_token }}">
      <div class="field">
        <label for="password">Nueva contraseña</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="password-confirmation">Repite la contraseña</label>
        <input id="password-confirmation" name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary btn-block" id="submit" type="submit">Actualizar contraseña</button>
    </form>

    <div class="auth-foot">
      <a href="/recuperar-acceso">Solicitar otro enlace</a>
    </div>
  </main>
</div>

<script nonce="{{ request.state.csp_nonce }}">
(function () {
  var hidden = document.getElementById('recovery-token');
  var params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  var token = hidden.value || params.get('access_token') || '';
  var type = params.get('type') || '';
  if (window.location.hash) history.replaceState(null, '', window.location.pathname);
  if (type && type !== 'recovery') token = '';
  hidden.value = token;
  if (!token) {
    document.getElementById('token-error').hidden = false;
    document.getElementById('submit').disabled = true;
  }
})();
</script>
</body>
</html>
