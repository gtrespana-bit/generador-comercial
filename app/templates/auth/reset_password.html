<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña · {{ product_name }}</title>
  <link rel="icon" type="image/png" href="/static/icono.png">
  <style>
    :root { font-family:Inter,ui-sans-serif,system-ui,sans-serif; color:#17211d; background:#f3f7f5; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; }
    main { width:min(100%,460px); background:#fff; padding:36px; border-radius:20px; box-shadow:0 22px 65px rgba(10,48,34,.14); }
    h1 { margin:0 0 10px; } p { color:#65766e; line-height:1.55; }
    label { display:block; margin:16px 0 7px; font-weight:700; }
    input { width:100%; padding:12px 13px; border:1px solid #b9c8c1; border-radius:10px; font:inherit; }
    button { width:100%; margin-top:18px; border:0; border-radius:10px; padding:13px; background:#146c43; color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; } a { color:#146c43; font-weight:700; }
    .alert { padding:12px 14px; border-radius:10px; margin:15px 0; background:#fff0f0; color:#9b2529; }
  </style>
</head>
<body><main>
  <h1>Elige una nueva contraseña</h1>
  <p>El enlace es temporal y se elimina de la barra del navegador al abrir esta página.</p>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <div id="token-error" class="alert" hidden>El enlace no contiene una sesión de recuperación válida. Solicita uno nuevo.</div>
  <form id="reset-form" method="post" action="/restablecer-clave">
    <input id="recovery-token" type="hidden" name="recovery_token" value="{{ recovery_token }}">
    <label for="password">Nueva contraseña</label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <label for="password-confirmation">Repite la contraseña</label>
    <input id="password-confirmation" name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required>
    <button id="submit" type="submit">Actualizar contraseña</button>
  </form>
  <p><a href="/recuperar-acceso">Solicitar otro enlace</a></p>
</main>
<script>
(function () {
  var hidden = document.getElementById('recovery-token');
  var params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  var token = hidden.value || params.get('access_token') || '';
  var type = params.get('type') || '';
  if (window.location.hash) history.replaceState(null, '', window.location.pathname);
  if (type && type !== 'recovery') token = '';
  hidden.value = token;
  if (!token) {
    document.getElementById('token-error').hidden = false;
    document.getElementById('submit').disabled = true;
  }
})();
</script>
</body>
</html>
