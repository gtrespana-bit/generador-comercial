<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Inicio{% endblock %} · {{ product_name }}</title>
<link rel="icon" type="image/png" href="/static/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body spellcheck="true">
<script>
  (function () {
    if (localStorage.getItem('sidebar-collapsed') === 'true') {
      document.body.classList.add('collapsed');
    }
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<aside class="sidebar">
  <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Toggle Sidebar">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.5 1.5L3 5l3.5 3.5"/></svg>
  </button>

  <div class="brand">
    <strong>
      <svg viewBox="0 0 28 28" fill="none">
        <rect x="2" y="2" width="24" height="24" rx="6" fill="currentColor" opacity="0.12"/>
        <path d="M8 9h12M8 14h8M8 19h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>{{ product_name }}</span>
    </strong>
  </div>

  <nav>
    <div class="nav-section">General</div>
    <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="6" height="6" rx="1.5"/><rect x="10.5" y="1.5" width="6" height="6" rx="1.5"/><rect x="1.5" y="10.5" width="6" height="6" rx="1.5"/><rect x="10.5" y="10.5" width="6" height="6" rx="1.5"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="/presupuestos" class="{{ 'active' if request.url.path.startswith('/presupuestos') else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.5h8.5L15 6v9.5a1 1 0 01-1 1H3a1 1 0 01-1-1v-12a1 1 0 011-1z"/><path d="M11 2.5V6h3.5"/><path d="M5 10h6M5 13h4"/></svg>
      <span>Presupuestos</span>
    </a>
    <a href="/reportes" class="{{ 'active' if request.url.path.startswith('/reportes') else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 14l4-5 3 3 4-6 3 4"/><circle cx="2" cy="14" r="0.5" fill="currentColor"/></svg>
      <span>Reportes</span>
    </a>
    <a href="/buscar" class="{{ 'active' if request.url.path == '/buscar' else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="7.5" r="5"/><path d="M16 16l-4-4"/></svg>
      <span>Buscador</span>
    </a>

    <div class="nav-section">Gestión</div>
    <a href="/proyectos" class="{{ 'active' if request.url.path.startswith('/proyectos') else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16h14M4 16V7l5-4 5 4v9"/><rect x="7" y="10" width="4" height="6" rx="0.5"/></svg>
      <span>Proyectos</span>
    </a>
    <a href="/facturas" class="{{ 'active' if request.url.path.startswith('/facturas') else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="1.5" width="14" height="15" rx="1.5"/><path d="M5 5h8M5 8h6M5 11h4"/><path d="M10 13h3"/></svg>
      <span>Documentos de cobro</span>
    </a>

    <div class="nav-section">Catálogos</div>
    <a href="/partidas" class="{{ 'active' if request.url.path.startswith('/partidas') else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h14M2 9h14M2 14h10"/></svg>
      <span>Partidas</span>
    </a>
    <a href="/recursos" class="{{ 'active' if request.url.path.startswith('/recursos') else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="7"/><path d="M9 5v4l3 2"/></svg>
      <span>Recursos</span>
    </a>
    <a href="/productos" class="{{ 'active' if request.url.path.startswith('/productos') else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5l7-3 7 3v8l-7 3-7-3V5z"/><path d="M2 5l7 3m0 0l7-3m-7 3v8"/></svg>
      <span>Productos</span>
    </a>
    <a href="/clientes" class="{{ 'active' if request.url.path.startswith('/clientes') else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="6" r="3"/><path d="M1 16c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M13 4a3 3 0 010 5M15 16c0-2.5-1.3-4.5-3-5.5"/></svg>
      <span>Clientes</span>
    </a>
    <a href="/plantillas" class="{{ 'active' if request.url.path.startswith('/plantillas') else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="14" height="14" rx="2"/><path d="M2 7h14M7 7v9"/></svg>
      <span>Plantillas</span>
    </a>
    <a href="/recetas" class="{{ 'active' if request.url.path.startswith('/recetas') else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2L4 10h5l-1 6 7-8h-5l1-6z"/></svg>
      <span>Packs de Estancia</span>
    </a>

    <div class="nav-section">Sistema</div>
    <a href="/configuracion" class="{{ 'active' if request.url.path == '/configuracion' else '' }}">
      <svg class="nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="2.5"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.4 3.4l1.4 1.4M13.2 13.2l1.4 1.4M3.4 14.6l1.4-1.4M13.2 4.8l1.4-1.4"/></svg>
      <span>Configuración</span>
    </a>
  </nav>

  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Cambiar tema" title="Modo claro / oscuro">
    <svg class="theme-icon-light" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="4"/><path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.9 3.9l1.4 1.4M12.7 12.7l1.4 1.4M3.9 14.1l1.4-1.4M12.7 5.3l1.4-1.4"/></svg>
    <svg class="theme-icon-dark" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="display:none"><path d="M15.1 10.4A7 7 0 017.6 2.9 7 7 0 1015.1 10.4z"/></svg>
  </button>
</aside>
<main class="content">
  {% block content %}{% endblock %}
</main>
<script>
  (function() {
    var toggle = document.getElementById('sidebar-toggle');
    if (toggle) {
      toggle.addEventListener('click', function() {
        document.body.classList.toggle('collapsed');
        localStorage.setItem('sidebar-collapsed', document.body.classList.contains('collapsed'));
      });
    }
    var themeBtn = document.getElementById('theme-toggle');
    if (themeBtn) {
      var iconLight = themeBtn.querySelector('.theme-icon-light');
      var iconDark = themeBtn.querySelector('.theme-icon-dark');
      var sync = function() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (iconLight && iconDark) {
          iconLight.style.display = dark ? 'none' : 'block';
          iconDark.style.display = dark ? 'block' : 'none';
        }
      };
      themeBtn.addEventListener('click', function() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (dark) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('theme','light');
        } else {
          document.documentElement.setAttribute('data-theme','dark');
          localStorage.setItem('theme','dark');
        }
        sync();
      });
      sync();
    }
  })();

  // Utilidades globales para descarga e impresión de documentos PDF
  function descargarPDF(event, url, filename) {
    if (event && typeof event.preventDefault === 'function') {
      event.preventDefault();
    }
    if (!url) return;

    fetch(url)
      .then(function(response) {
        if (!response.ok) {
          throw new Error('Error al descargar el archivo: HTTP ' + response.status);
        }
        return response.blob();
      })
      .then(function(blob) {
        var blobUrl = window.URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = blobUrl;
        link.download = filename || 'documento.pdf';
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        setTimeout(function() {
          if (link.parentNode) link.parentNode.removeChild(link);
          window.URL.revokeObjectURL(blobUrl);
        }, 2000);
      })
      .catch(function(err) {
        // Si la descarga por blob falla, se navega a la URL: el servidor
        // responde con Content-Disposition: attachment, así el navegador
        // descarga el archivo de forma nativa (o muestra el error si la
        // generación falló).
        console.warn('Fallo en descarga directa por blob, navegando a URL:', err);
        window.location.href = url;
      });
  }

  function imprimirPDF(url) {
    if (!url) return;

    var frameId = 'pdf-print-iframe';
    var iframe = document.getElementById(frameId);
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.id = frameId;
      iframe.style.position = 'fixed';
      iframe.style.right = '0';
      iframe.style.bottom = '0';
      iframe.style.width = '0';
      iframe.style.height = '0';
      iframe.style.border = 'none';
      iframe.style.opacity = '0';
      iframe.style.pointerEvents = 'none';
      document.body.appendChild(iframe);
    }

    fetch(url)
      .then(function(response) {
        if (!response.ok) throw new Error('Error al cargar PDF: HTTP ' + response.status);
        return response.blob();
      })
      .then(function(blob) {
        var blobUrl = window.URL.createObjectURL(blob);
        iframe.src = blobUrl;
        iframe.onload = function() {
          setTimeout(function() {
            try {
              iframe.contentWindow.focus();
              iframe.contentWindow.print();
            } catch (e) {
              console.warn('No se pudo imprimir directamente desde iframe, abriendo ventana:', e);
              var printWin = window.open(blobUrl, '_blank');
              if (printWin) {
                printWin.focus();
                printWin.print();
              }
            }
            setTimeout(function() {
              window.URL.revokeObjectURL(blobUrl);
            }, 60000);
          }, 500);
        };
      })
      .catch(function(err) {
        console.warn('Error al obtener PDF para imprimir, abriendo URL:', err);
        var win = window.open(url, '_blank');
        if (win) {
          win.focus();
        }
      });
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
