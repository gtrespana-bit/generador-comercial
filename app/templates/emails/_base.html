<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}{{ product_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#eef3f0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#17211d;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef3f0;padding:28px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(10,48,34,.10);">

        <!-- Cabecera de marca -->
        <tr>
          <td style="background:#0b5b38;background-image:linear-gradient(135deg,#0b5b38 0%,#0a6b40 60%,#0f7a4a 100%);padding:26px 36px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td>
                  <div style="font-size:24px;font-weight:900;letter-spacing:-0.5px;color:#ffffff;line-height:1;">
                    {% block marca %}{{ product_name }}{% endblock %}
                  </div>
                  <div style="margin-top:6px;font-size:12px;font-weight:600;letter-spacing:1.5px;color:#bfe6d2;text-transform:uppercase;">
                    {% block subtitulo %}Presupuestos de obra{% endblock %}
                  </div>
                </td>
                <td align="right" valign="top">
                  {% block badge %}{% endblock %}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:34px 36px 8px;">
            {% block content %}{% endblock %}
          </td>
        </tr>

        <!-- Pie -->
        <tr>
          <td style="background:#f7faf8;border-top:1px solid #e3ece7;padding:20px 36px;">
            <p style="margin:0 0 6px;font-size:12px;line-height:1.6;color:#8ba096;text-align:center;">
              {% block copyright %}© {{ anio }} {{ product_name }} · Presupuestos{% endblock %}
            </p>
            <p style="margin:0;font-size:11px;line-height:1.6;color:#a9b8b1;text-align:center;">
              {% block pie %}{% endblock %}
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
