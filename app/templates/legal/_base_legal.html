<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Información legal{% endblock %} · {{ product_name }}</title>
  <link rel="icon" type="image/png" href="/static/icono.png">
      <link rel="stylesheet" href="{{ 'css/fonts.css' | asset }}">
  <link rel="stylesheet" href="{{ 'css/public.css' | asset }}">
</head>
<body class="legal-body">
<header class="legal-header">
  <a class="brand" href="/conocer">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 3.5h6.5L18 8v11a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5a1.5 1.5 0 0 1 1-1.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M13.5 3.5V8H18" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M9 14.5l2 2 4-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    {{ product_name }}
  </a>
  <a href="/acceso">Iniciar sesión</a>
</header>
<main class="legal-main">
{% block contenido %}{% endblock %}
</main>
<footer class="legal-footer">
  <a href="/legal/terminos">Términos del servicio</a>
  <a href="/legal/privacidad">Privacidad</a>
  <a href="/legal/preguntas">Preguntas frecuentes</a>
  <a href="/legal/soporte">Soporte</a>
  <a href="/legal/licencias">Licencias de terceros</a>
</footer>
</body>
</html>
