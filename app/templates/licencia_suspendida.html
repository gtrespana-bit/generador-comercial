<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso suspendido · {{ product_name }}</title>
  <link rel="icon" type="image/png" href="/static/icono.png">
      <link rel="stylesheet" href="{{ 'css/fonts.css' | asset }}">
  <link rel="stylesheet" href="{{ 'css/public.css' | asset }}">
</head>
<body>
<div class="auth-stage">
  <main class="auth-card">
    <a class="brand" href="/">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 3.5h6.5L18 8v11a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5a1.5 1.5 0 0 1 1-1.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M13.5 3.5V8H18" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9 14.5l2 2 4-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      {{ product_name }}
    </a>

    <h1>Acceso suspendido</h1>
    <p>{{ error }}</p>
    <div class="alert warn">Tus presupuestos, clientes, catálogos y archivos <strong>no se han borrado</strong>: vuelven a estar disponibles en cuanto la licencia se renueva.</div>
    <p class="text-soft">Para reactivar el acceso o pedir una copia de tus datos, escríbenos a <a href="mailto:{{ email_soporte }}">{{ email_soporte }}</a>.</p>

    <div class="actions mt-3">
      <a class="btn btn-primary" href="/organizaciones">Elegir otra organización</a>
      <form method="post" action="/salir" class="mt-1"><button class="btn btn-block" type="submit">Cerrar sesión</button></form>
    </div>
  </main>
</div>
</body>
</html>
