<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso suspendido · {{ product_name }}</title>
  <style nonce="{{ request.state.csp_nonce }}">:root{font-family:Inter,system-ui,sans-serif;color:#17211d;background:#f3f7f5}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(100%,560px);background:white;padding:34px;border-radius:18px;box-shadow:0 18px 55px rgba(10,48,34,.12)}h1{color:#9b6114;font-size:1.5rem;margin:0 0 12px}.brand{font-weight:900;color:#0b5b38;font-size:1.1rem;margin-bottom:18px}p{line-height:1.6;color:#475a51;font-size:.95rem}.datos{background:#f3f7f5;border-radius:10px;padding:12px 14px;font-size:.88rem;color:#33433b}.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}.button{display:inline-block;padding:12px 16px;border-radius:9px;background:#146c43;color:white;text-decoration:none;font-weight:800;font-size:.92rem;border:0;cursor:pointer;font-family:inherit}.button.sec{background:#eef2f0;color:#146c43}a{color:#0b5b38}form{margin:0}</style>
</head>
<body><main>
  <div class="brand">{{ product_name }}</div>
  <h1>Acceso suspendido</h1>
  <p>{{ error }}</p>
  <p class="datos">Tus presupuestos, clientes, catálogos y archivos
  <strong>no se han borrado</strong>: vuelven a estar disponibles en cuanto la
  licencia se renueva.</p>
  <p>Para reactivar el acceso o pedir una copia de tus datos, escríbenos a
  <a href="mailto:{{ email_soporte }}">{{ email_soporte }}</a>.</p>
  <div class="acciones">
    <a class="button" href="/organizaciones">Elegir otra organización</a>
    <form method="post" action="/salir"><button class="button sec" type="submit">Cerrar sesión</button></form>
  </div>
</main></body>
</html>
